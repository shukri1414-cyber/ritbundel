<style>
:root{--steel:#E4E8EE;--paper:#FFFFFF;--ink:#161B26;--ink2:#5B6475;--rule:#D9DEE5;--hi:#FFD43B;--red:#C2331F;--ok:#1F8A5B}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--steel)}
body{font-family:"Rubik",system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 calc(128px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 6px;max-width:620px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.3px;flex:1}
.mark{display:inline-grid;place-items:center;width:40px;height:30px;background:var(--hi);transform:skew(-8deg) rotate(-3deg);border-radius:4px 9px 5px 10px;font-weight:800;font-size:15px}
.mark span{transform:skew(8deg) rotate(3deg)}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:var(--paper);font-weight:500;font-size:14px;box-shadow:0 1px 0 var(--rule)}
.chip svg{width:18px;height:18px}
.icon{width:40px;padding:0;justify-content:center}
.status{max-width:620px;margin:0 auto;padding:4px 20px 14px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA3B2}
.dot.ok{background:var(--ok)}.dot.busy{background:#E8A317;animation:pulse 1.2s infinite}.dot.bad{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
main{max-width:620px;margin:0 auto;padding:0 14px}
.empty{background:var(--paper);border-radius:6px;padding:28px 22px 30px;text-align:center;position:relative}
.empty svg{width:132px;height:auto;margin:0 auto 18px;display:block}
.empty h2{font-size:20px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--ink2);line-height:1.6;font-size:15px;max-width:36ch;margin:0 auto}
.slip{background:var(--paper);margin-bottom:22px;position:relative;padding-bottom:10px;filter:drop-shadow(0 1px 0 var(--rule))}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x}
.sh-head{display:flex;align-items:center;gap:14px;padding:16px 16px 14px;border-bottom:1.5px dashed var(--rule)}
.swatch{display:inline-grid;place-items:center;font-weight:800;color:var(--ink);transform:skew(-8deg) rotate(-2deg);border-radius:4px 10px 5px 11px}
.swatch>span{transform:skew(8deg) rotate(2deg);direction:ltr}
.sw-big{width:62px;height:52px;font-size:30px;flex:none}
.meta{flex:1;line-height:1.35}
.meta b{display:block;font-size:17px;font-weight:700}
.meta small{display:block;font-size:13.5px;color:var(--ink2)}
.meta .late{color:var(--red);font-weight:500}
.tag{font-size:12px;font-weight:500;padding:3px 9px;border-radius:12px;background:var(--steel);color:var(--ink2);flex:none}
.stop{display:flex;align-items:center;gap:12px;padding:11px 16px}
.stop+.stop{border-top:1px solid #EEF1F5}
.sw-sm{min-width:54px;height:34px;padding:0 8px;font-size:17px}
.addr{flex:1;min-width:0;direction:ltr;text-align:start;unicode-bidi:plaintext}
.addr b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr small{font-size:13px;color:var(--ink2)}
.x{width:36px;height:36px;border-radius:50%;color:#8A93A3;font-size:20px;flex:none}
.x:hover{background:var(--steel)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 16px 6px;width:calc(100% - 32px);height:52px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:16.5px}
.go svg{width:20px;height:20px;color:var(--hi)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(228,232,238,0),var(--steel) 30%)}
.dock-in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.scan{flex:1;height:66px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:19px;box-shadow:0 10px 24px -12px rgba(22,27,38,.7)}
.scan svg{width:28px;height:28px;color:var(--hi)}
.typeb{height:66px;padding:0 16px;border-radius:18px;background:var(--paper);font-weight:500;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 1px 0 var(--rule)}
.typeb svg{width:22px;height:22px}
.ov{position:fixed;inset:0;background:rgba(22,27,38,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.dot.busy{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 16px}
.sheet h2{font-size:20px;font-weight:700;margin-bottom:14px}
.result{text-align:center;padding:6px 0 4px}
.sw-hero{min-width:170px;height:118px;padding:0 26px;font-size:76px;margin:6px auto 18px}
.lead{font-size:16px;line-height:1.5;margin-bottom:16px}
.card{background:var(--steel);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;color:var(--ink2);text-align:start}
.card b{color:var(--ink);font-weight:500;font-size:15.5px;display:block;direction:ltr;text-align:start;unicode-bidi:plaintext}
.btns{display:flex;gap:10px;margin-top:18px}
.b{flex:1;height:52px;border-radius:12px;font-weight:700;font-size:16px}
.bp{background:var(--ink);color:#fff}.bs{background:var(--steel)}.bw{background:#FBE4DF;color:var(--red)}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 5px}
input{width:100%;height:48px;padding:0 13px;border:1.5px solid var(--rule);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus{border-color:var(--ink);outline:none}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.err{color:var(--red);font-size:14px;margin-top:10px;line-height:1.45}
.spin{width:46px;height:46px;border:4px solid var(--steel);border-top-color:var(--ink);border-radius:50%;margin:24px auto 16px;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hint{text-align:center;color:var(--ink2);font-size:15px;line-height:1.5}
.route{list-style:none;padding:0;margin:0 0 14px}
.route li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EEF1F5}
a.map{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:12px;background:var(--hi);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
#qrbox{display:flex;justify-content:center;padding:14px;margin-top:6px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang{height:52px;border-radius:12px;background:var(--steel);font-weight:500;font-size:16px}
.lang.on{background:var(--ink);color:#fff}
.small{font-size:13px;color:var(--ink2);line-height:1.55;margin-top:14px}
</style>
</head>

const DEF={name:"Florence Pizza & Grill",addr:"Kerkstraat 24A, 4041 XB Kesteren",pc:"4041XB",lat:51.9333,lng:5.5704,maxN:4,maxAge:20,maxDet:5,speed:35};
let S=Object.assign({},DEF);
try{const s=localStorage.getItem("rb_settings");if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}

// ===== State (memory only) =====
let groups=[];let letterIdx=0;
const HI=["#FFD43B","#63E6BE","#74C0FC","#FFA8C5","#FFC078","#B197FC","#A9E34B","#FF8787"];

// ===== Geometry =====
const R=6371;
function km(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function mins(a,b){return km(a,b)*1.35/S.speed*60}
function home(){return{lat:S.lat,lng:S.lng}}
function tourMin(stops){let p=home(),m=0;for(const s of stops){m+=mins(p,s);p=s}return m+mins(p,home())}

// ===== Codes on the slips never change =====
function pl(l){const m=String(l).match(/^(\d+)([a-z]*)$/);return{n:+m[1],s:m[2]}}
function nl(s){if(!s)return"a";const c=s[s.length-1];return c==="z"?s+"a":s.slice(0,-1)+String.fromCharCode(c.charCodeAt(0)+1)}
function labelAt(stops,i){
if(!stops.length)return"1";
const prev=i>0?pl(stops[i-1].label):null,next=i<stops.length?pl(stops[i].label):null;
if(!prev){return next.n>=1&&!next.s?String(next.n-1):null}
if(!next)return String(prev.n+1);
return next.n>prev.n?prev.n+nl(prev.s):null;
}
function bestInsert(stops,o){
const base=tourMin(stops);let best=null;
for(let i=0;i<=stops.length;i++){
const lab=labelAt(stops,i);if(lab===null)continue;
const s2=stops.slice();s2.splice(i,0,o);const d=tourMin(s2)-base;
if(!best||d<best.d)best={i,d,lab};
}return best;
}
function ageMin(g){return(Date.now()-g.created)/60000}
function place(o){
let best=null;
for(const g of groups){
if(g.stops.length>=S.maxN||ageMin(g)>=S.maxAge)continue;
const b=bestInsert(g.stops,o);
if(b&&b.d<=S.maxDet&&(!best||b.d<best.b.d))best={g,b};
}
let isNew=false;
if(!best){
const L=String.fromCharCode(65+(letterIdx%26));letterIdx++;
const g={id:Date.now()+Math.random(),letter:L,color:HI[(letterIdx-1)%HI.length],created:Date.now(),stops:[]};
groups.push(g);best={g,b:{i:0,d:tourMin([o]),lab:"1"}};isNew=true;
}
o.label=best.b.lab;best.g.stops.splice(best.b.i,0,o);
return{g:best.g,o,d:best.b.d,isNew};
}
function removeOrder(g,o){g.stops=g.stops.filter(x=>x!==o);if(!g.stops.length)groups=groups.filter(x=>x!==g)}

// ===== Reading the slip on the phone (OCR, nothing uploaded) =====
let ocrP=null,ocrState="";
function ocrWorker(){
if(ocrP)return ocrP;
ocrState="loading";render();
ocrP=Promise.resolve().then(()=>Tesseract.createWorker("nld",1)).then(w=>{ocrState="ready";render();return w}).catch(e=>{ocrP=null;ocrState="error";render();throw e});
return ocrP;
}
const normPC=s=>String(s||"").toUpperCase().replace(/\s+/g,"");
function fixDigits(s){return s.replace(/[Oo]/g,"0").replace(/[Il|]/g,"1").replace(/S/g,"5").replace(/B/g,"8")}
function parseSlip(text){
const L=text.split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
const own=normPC(S.pc);let cand=[];
const levIdx=L.findIndex(l=>/levering|bezorg|bevestigde/i.test(l));
L.forEach((l,i)=>{
const m=l.match(/(?:^|[^0-9A-Za-z])([1-9OoIl][0-9OoIlSB]{3}) ?([A-Za-z]{2})\b(.*)$/);
if(!m)return;
const pc=fixDigits(m[1])+m[2].toUpperCase();
if(!/^[1-9]\d{3}[A-Z]{2}$/.test(pc)||pc===own||/tel/i.test(l))return;
cand.push({i,pc,city:m[3].replace(/[^A-Za-zÀ-ÿ' -]/g,"").trim()});
});
if(!cand.length)return null;
const c=cand.find(x=>levIdx>=0&&x.i>levIdx)||cand[cand.length>1?1:0];
let street=null,number=null;
for(let k=c.i-1;k>=Math.max(0,c.i-2);k--){
const s=L[k];if(/bevestigde|levering|tijd|\d{1,2}:\d{2}/i.test(s))break;
const m=s.match(/^(.*?[A-Za-zÀ-ÿ.'-]{3,})\s+(\d{1,5}\s?[A-Za-z]?(?:[- ]\d{1,4})?)$/);
if(m){street=m[1];number=m[2];break}
if(/(straat|weg|laan|plein|dijk|kade|singel|hof|gracht|dreef|pad|steeg|markt|ring|park|veld|erf|baan|wal|dam|haven|tuin|berg|meer|akker|kamp|hoek|zoom|oord|dal|burg|rade|horst)\b/i.test(s)||k===c.i-1){street=s.replace(/[^A-Za-zÀ-ÿ0-9 .'-]/g,"").trim();if(/(straat|weg|laan|plein|dijk|kade|singel|hof|gracht|dreef|pad|steeg|markt|ring)/i.test(s))break}
}
let time=null;const ti=L.findIndex(l=>/bevestigde|tijd/i.test(l));
for(let k=Math.max(0,ti);k<Math.min(L.length,(ti<0?L.length:ti+3));k++){const m=L[k].match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);if(m&&!/\d{2}-\d{2}-\d{4}/.test(L[k])){time=m[1].padStart(2,"0")+":"+m[2];break}}
const r=L.find(l=>/^[A-Z0-9]{6}$/.test(l)&&/[A-Z]/.test(l)&&/\d/.test(l)&&!/^\d{4}[A-Z]{2}$/.test(l));
return{street,number,postcode:c.pc.slice(0,4)+" "+c.pc.slice(4),city:c.city||null,time,ref:r||null};
}
async function readSlip(img){
const w=await ocrWorker();
const c=scaled(img,2400),x=c.getContext("2d"),d=x.getImageData(0,0,c.width,c.height),p=d.data;
for(let i=0;i<p.length;i+=4){const v=.3*p[i]+.59*p[i+1]+.11*p[i+2];p[i]=p[i+1]=p[i+2]=v}
x.putImageData(d,0,0);
const {data}=await w.recognize(c);
return parseSlip(data.text);
}

// ===== Address to location: PDOK (official Dutch address service) =====
async function pdok(q,fq){
const u="https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?rows=1&fl=centroide_ll,weergavenaam,type&q="+encodeURIComponent(q)+(fq?"&fq="+encodeURIComponent(fq):"")+`&lat=${S.lat}&lon=${S.lng}`;
const r=await fetch(u);if(!r.ok)throw new Error("pdok");const j=await r.json();const d=j.response&&j.response.docs&&j.response.docs[0];
if(!d||!d.centroide_ll)return null;const m=d.centroide_ll.match(/POINT\(([-\d.]+) ([-\d.]+)\)/);
return m?{lat:+m[2],lng:+m[1],src:d.type,name:d.weergavenaam}:null;
}
async function locate(a){
const pc=normPC(a.postcode),tries=[];
if(a.street&&a.number&&pc)tries.push([`${a.street} ${a.number} ${pc}`,"type:adres"]);
if(a.street&&pc)tries.push([`${a.street} ${pc}`,"type:(adres OR weg)"]);
if(pc)tries.push([pc,"type:postcode"]);
if(pc.length>=4)tries.push([pc.slice(0,4),"type:postcode"]);
if(a.street&&a.city)tries.push([`${a.street} ${a.number||""} ${a.city}`,"type:(adres OR weg)"]);
for(const[q,fq]of tries){try{const r=await pdok(q,fq);if(r&&km(r,home())<60){if(r.src==="adres"&&!a.number)r.src="weg";return r}}catch(e){if(!navigator.onLine)throw e}}
return null;
}
function precText(s){return s==="adres"?t("precExact"):s==="weg"?t("precStreet"):t("precArea")}

// ===== Image helpers =====
function loadImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}
function scaled(img,max){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function qrRef(img){try{for(const m of[1400,900]){const c=scaled(img,m),d=c.getContext("2d").getImageData(0,0,c.width,c.height),q=window.jsQR&&jsQR(d.data,c.width,c.height);if(q&&q.data){const r=q.data.match(/[?&]ref=([A-Za-z0-9]+)/);return{raw:q.data,ref:r?r[1]:null}}}}catch(e){}return null}

function manual(p={}){

if(!o.postcode&&!o.street){$("#m_err").textContent=t("needPc");return}
$("#m_ok").textContent="…";
let ll=null;try{ll=await locate(o)}catch(e){}
if(!ll){$("#m_ok").textContent=t("add");$("#m_err").textContent=navigator.onLine?t("notFound"):t("noNet");return}
Object.assign(o,ll);result(place(o));
};
}
$("#manBtn").onclick=()=>manual();

// ----- Departure -----
function q(o){return encodeURIComponent([[o.street,o.number].filter(Boolean).join(" "),o.postcode,o.city,"Nederland"].filter(Boolean).join(", "))}
function mapsUrl(g){
const st=g.stops,origin=encodeURIComponent(S.addr+", Nederland"),last=st[st.length-1];
const wp=st.slice(0,-1).map(q).join("%7C");
return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${q(last)}${wp?"&waypoints="+wp:""}&travelmode=driving`;
}
function depart(g){
const url=mapsUrl(g);
open(`<h2>${t("route",{L:g.letter})}</h2>
<ol class="route">${g.stops.map(o=>`<li>${sw(g,g.letter+o.label,"sw-sm")}<div class="addr"><b>${esc(street(o))}</b><small>${esc(sub(o))}</small></div></li>`).join("")}</ol>
<a class="map" href="${url}" target="_blank" rel="noopener">${t("openMaps")}</a>
<p class="small" style="text-align:center">${t("scanQR")}</p><div id="qrbox"></div>
<p class="small" style="text-align:center;margin-top:4px">${t("houseNr")}</p>
<div class="btns"><button class="b bs" id="d_no">${t("back")}</button><button class="b bp" id="d_ok">${t("gone")}</button></div>`);
try{new QRCode($("#qrbox"),{text:url,width:200,height:200,colorDark:"#161B26",correctLevel:QRCode.CorrectLevel.L})}catch(e){}
$("#d_no").onclick=close;$("#d_ok").onclick=()=>{groups=groups.filter(x=>x!==g);close()};
}

// ----- Language -----
$("#langBtn").onclick=()=>{
open(`<h2>${t("language")}</h2><div class="langs">${Object.keys(I18N).map(k=>`<button class="lang ${k===LANG?"on":""}" data-l="${k}" lang="${k}">${I18N[k].name}</button>`).join("")}</div>`);
$("#sh").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem("rb_lang",LANG)}catch(e){}applyLang();close()});
};

// ----- Settings -----
$("#setBtn").onclick=()=>{
open(`<h2>${t("settings")}</h2>
<label for="s_n">${t("restName")}</label><input id="s_n" value="${esc(S.name)}">
<label for="s_a">${t("restAddr")}</label><input id="s_a" dir="ltr" value="${esc(S.addr)}">
<p class="small" id="s_loc" style="margin-top:6px">${t("restHint")}</p>
<div class="row"><div><label for="s_n2">${t("maxN")}</label><input id="s_n2" type="number" inputmode="numeric" value="${S.maxN}"></div><div><label for="s_age">${t("maxAge")}</label><input id="s_age" type="number" inputmode="numeric" value="${S.maxAge}"></div></div>
<div class="row"><div><label for="s_det">${t("maxDet")}</label><input id="s_det" type="number" inputmode="numeric" value="${S.maxDet}"></div><div><label for="s_sp">${t("speed")}</label><input id="s_sp" type="number" inputmode="numeric" value="${S.speed}"></div></div>
<p class="small">${t("privacy")}</p>
<div class="btns"><button class="b bw" id="s_clr">${t("clear")}</button><button class="b bp" id="s_ok">${t("save")}</button></div>`);
$("#s_ok").onclick=async()=>{
const na=$("#s_a").value.trim();
if(na!==S.addr){$("#s_ok").textContent="…";let r=null;try{r=await pdok(na,"type:adres")}catch(e){}
if(!r){$("#s_ok").textContent=t("save");const l=$("#s_loc");l.textContent=t("restErr");l.style.color="var(--red)";return}
S.lat=r.lat;S.lng=r.lng;S.addr=na;const m=na.match(/([1-9]\d{3}) ?([A-Za-z]{2})/);S.pc=m?(m[1]+m[2]).toUpperCase():"";}
S.name=$("#s_n").value;S.maxN=Math.max(1,+$("#s_n2").value||4);S.maxAge=Math.max(1,+$("#s_age").value||20);S.maxDet=Math.max(0,+$("#s_det").value||5);S.speed=Math.max(5,+$("#s_sp").value||35);saveS();close()};
$("#s_clr").onclick=()=>{groups=[];letterIdx=0;close()};
};
